plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "Modrinth"
        url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"progression_pls" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:trinkets-updated:4.1.0+26.2"
}

// --- Automatic PATCH-version bump, on real `build` runs only ---------------
// Only fires when the actual `build` task is requested (a real packaged jar),
// never on the incremental compileJava/classes runs an IDE fires constantly
// in the background while you type -- so patch numbers stay meaningful
// instead of climbing into the hundreds from routine editing.
//
// MAJOR and MINOR are never touched here on purpose: those are a deliberate
// call you make yourself in gradle.properties when a release actually adds a
// feature (bump MINOR) or breaks compatibility (bump MAJOR) -- see SemVer.
if (gradle.startParameter.taskNames.any { it == 'build' || it.endsWith(':build') }) {
	def propsFile = file('gradle.properties')
	def propsText = propsFile.text
	def matcher = propsText =~ /(?m)^version=(\d+)\.(\d+)\.(\d+)(.*)$/
	if (matcher.find()) {
		def major = matcher.group(1)
		def minor = matcher.group(2)
		def patch = matcher.group(3).toInteger() + 1
		def suffix = matcher.group(4) // preserves "-alpha", "+26.2", etc. untouched

		def newVersion = "${major}.${minor}.${patch}${suffix}"

		propsFile.text = propsText.replaceFirst(/(?m)^version=.*$/, "version=${newVersion}")
		project.version = newVersion

		logger.lifecycle("Auto-incremented patch version -> ${newVersion}")
	} else {
		logger.warn("Could not parse 'version=' in gradle.properties for auto-increment; leaving it as-is.")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
